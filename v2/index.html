<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Prism</title>
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f0efeb">
    <link rel="icon" href="favicon.ico?v=10" sizes="16x16 24x24 32x32 48x48 64x64 128x128 256x256" type="image/x-icon">
    <link rel="icon" href="favicon.svg?v=10" sizes="any" type="image/svg+xml">
    <link rel="apple-touch-icon" href="apple-touch-icon.png?v=10" sizes="180x180">
    <link rel="stylesheet" href="vendor/quill.snow.css">
    <link rel="stylesheet" href="styles/fonts.css">
    <link rel="stylesheet" href="styles/styles.css">
</head>

<body>
    <!-- Icon sprite: inlined so icons never depend on a network or a JS pass. -->
    <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="display:none" id="icon-sprite">
        <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5" /></symbol>
        <symbol id="i-save" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z" /> <path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7" /> <path d="M7 3v4a1 1 0 0 0 1 1h7" /></symbol>
        <symbol id="i-folder-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2" /></symbol>
        <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14" /> <path d="M12 5v14" /></symbol>
        <symbol id="i-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /> <polyline points="7 10 12 15 17 10" /> <line x1="12" x2="12" y1="15" y2="3" /></symbol>
        <symbol id="i-scan-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2" /> <path d="M17 3h2a2 2 0 0 1 2 2v2" /> <path d="M21 17v2a2 2 0 0 1-2 2h-2" /> <path d="M7 21H5a2 2 0 0 1-2-2v-2" /> <circle cx="12" cy="12" r="3" /> <path d="m16 16-1.9-1.9" /></symbol>
        <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18" /> <path d="m6 6 12 12" /></symbol>
        <symbol id="i-pencil-line" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9" /> <path d="M16.376 3.622a1 1 0 0 1 3.002 3.002L7.368 18.635a2 2 0 0 1-.855.506l-2.872.838a.5.5 0 0 1-.62-.62l.838-2.872a2 2 0 0 1 .506-.854z" /> <path d="m15 5 3 3" /></symbol>
        <symbol id="i-calendar-days" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4" /> <path d="M16 2v4" /> <rect width="18" height="18" x="3" y="4" rx="2" /> <path d="M3 10h18" /> <path d="M8 14h.01" /> <path d="M12 14h.01" /> <path d="M16 14h.01" /> <path d="M8 18h.01" /> <path d="M12 18h.01" /> <path d="M16 18h.01" /></symbol>
        <symbol id="i-undo-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5" /> <path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11" /></symbol>
        <symbol id="i-file-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" /> <path d="M14 2v4a2 2 0 0 0 2 2h4" /> <path d="M12 18v-6" /> <path d="m9 15 3 3 3-3" /></symbol>
        <symbol id="i-triangle-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3" /> <path d="M12 9v4" /> <path d="M12 17h.01" /></symbol>
        <symbol id="i-image" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2" /> <circle cx="9" cy="9" r="2" /> <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21" /></symbol>
        <symbol id="i-volume-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z" /> <path d="M16 9a5 5 0 0 1 0 6" /> <path d="M19.364 18.364a9 9 0 0 0 0-12.728" /></symbol>
        <symbol id="i-video" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5" /> <rect x="2" y="6" width="14" height="12" rx="2" /></symbol>
        <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8" /> <path d="m21 21-4.3-4.3" /></symbol>
        <symbol id="i-arrow-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7" /> <path d="M19 12H5" /></symbol>
        <symbol id="i-external-link" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6" /> <path d="M10 14 21 3" /> <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" /></symbol>
        <symbol id="i-clock-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /> <polyline points="12 6 12 12 16.5 12" /></symbol>
        <symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4" /> <path d="M12 2v2" /> <path d="M12 20v2" /> <path d="m4.93 4.93 1.41 1.41" /> <path d="m17.66 17.66 1.41 1.41" /> <path d="M2 12h2" /> <path d="M20 12h2" /> <path d="m6.34 17.66-1.41 1.41" /> <path d="m19.07 4.93-1.41 1.41" /></symbol>
        <symbol id="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" /></symbol>
        <symbol id="i-trash-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18" /> <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" /> <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" /> <line x1="10" x2="10" y1="11" y2="17" /> <line x1="14" x2="14" y1="11" y2="17" /></symbol>
    </svg>

    <header class="app-header" role="banner">
        <div class="logo">
            <span class="logo-text" role="img" aria-label="Memory Prism">Memory Prism</span>
            <a class="version-button" href="../index.html" title="Switch to v1" aria-label="Switch to v1">v1</a>
        </div>
        <div class="header-tools">
            <button class="icon-button" id="theme-toggle" type="button" title="Switch theme" aria-label="Switch theme">
                <svg class="icon" aria-hidden="true"><use href="#i-moon"></use></svg>
            </button>
        </div>
    </header>

    <main class="page" id="main">
        <aside class="sidebar">
            <section class="card date-card" aria-labelledby="date-heading">
                <div class="card-head">
                    <h2 id="date-heading">Today</h2>
                </div>
                <div class="date-body">
                    <p class="date-weekday" id="today-weekday"></p>
                    <p class="date-main"><span id="today-date"></span><span class="date-year" id="today-year"></span></p>
                    <p class="date-time" id="today-time"></p>
                </div>
            </section>

            <div class="primary-wrap">
                <button class="primary" id="keep-button" type="button">
                    <svg class="icon" aria-hidden="true"><use href="#i-check"></use></svg>
                    <span id="keep-label">Keep this entry</span>
                </button>
                <p class="hint"><kbd>Ctrl</kbd> + <kbd>Enter</kbd></p>
            </div>

            <section class="card actions" aria-label="Entry actions">
                <div class="group">
                    <p class="group-label" id="group-entry">Entry</p>
                    <div class="tiles" role="group" aria-labelledby="group-entry">
                        <button class="tile" id="save-button" type="button">
                            <svg class="icon" aria-hidden="true"><use href="#i-save"></use></svg>
                            <span>Save a copy</span>
                        </button>
                        <button class="tile" id="open-button" type="button">
                            <svg class="icon" aria-hidden="true"><use href="#i-folder-open"></use></svg>
                            <span>Open a file</span>
                        </button>
                    </div>
                </div>
                <div class="group">
                    <p class="group-label" id="group-media">Media</p>
                    <div class="tiles" role="group" aria-labelledby="group-media">
                        <button class="tile" id="media-button" type="button">
                            <svg class="icon" aria-hidden="true"><use href="#i-plus"></use></svg>
                            <span>Add media</span>
                        </button>
                        <button class="tile" id="download-button" type="button">
                            <svg class="icon" aria-hidden="true"><use href="#i-download"></use></svg>
                            <span>Download</span>
                        </button>
                    </div>
                </div>
                <div class="group">
                    <p class="group-label" id="group-view">View</p>
                    <div class="tiles" role="group" aria-labelledby="group-view">
                        <button class="tile" id="focus-button" type="button" aria-pressed="false">
                            <svg class="icon" aria-hidden="true"><use href="#i-scan-search"></use></svg>
                            <span>Focus images</span>
                        </button>
                        <button class="tile" id="markdown-button" type="button">
                            <svg class="icon" aria-hidden="true"><use href="#i-file-down"></use></svg>
                            <span>Markdown</span>
                        </button>
                    </div>
                </div>
            </section>

            <section class="card recent" aria-labelledby="recent-heading">
                <div class="card-head">
                    <h2 id="recent-heading">Recent</h2>
                    <button class="link" id="all-entries" type="button">All entries</button>
                </div>
                <div class="days" id="days" role="group" aria-label="Last fourteen days"></div>
                <p class="recent-foot" id="recent-foot"></p>
            </section>
        </aside>

        <div class="writing">
            <section class="card editor-card" aria-labelledby="editor-heading">
                <h2 class="sr-only" id="editor-heading">Write today's memory</h2>
                <div id="editor"></div>
                <div class="editor-foot">
                    <p class="status" id="editor-status" role="status">Draft saves automatically</p>
                    <button class="link" id="cancel-edit" type="button" hidden>Cancel editing</button>
                </div>
            </section>

            <section class="card output-card" id="output-card" aria-labelledby="output-heading" hidden>
                <div class="output-head">
                    <h2 class="output-meta" id="output-heading"></h2>
                    <div class="output-actions">
                        <button class="link" id="edit-entry" type="button">Edit</button>
                        <button class="link danger" id="delete-entry" type="button">Delete</button>
                    </div>
                </div>
                <div class="output-body">
                    <div id="output"></div>
                </div>
            </section>
        </div>
    </main>

    <div id="alert-bar" role="alert" hidden>
        <svg class="icon" aria-hidden="true"><use href="#i-triangle-alert"></use></svg>
        <span id="alert-text"></span>
        <button class="link" id="alert-action" type="button" hidden></button>
        <button class="icon-button" id="alert-close" type="button" aria-label="Dismiss warning">
            <svg class="icon" aria-hidden="true"><use href="#i-x"></use></svg>
        </button>
    </div>

    <div id="toast" role="status" aria-live="polite"></div>

    <dialog id="entries-dialog" aria-labelledby="entries-title">
        <div class="dialog-head">
            <h2 id="entries-title">All entries</h2>
            <button class="icon-button" id="entries-close" type="button" aria-label="Close">
                <svg class="icon" aria-hidden="true"><use href="#i-x"></use></svg>
            </button>
        </div>
        <label class="search-field">
            <svg class="icon" aria-hidden="true"><use href="#i-search"></use></svg>
            <span class="sr-only">Search entries</span>
            <input id="entries-search" type="search" placeholder="Search entries" autocomplete="off">
        </label>
        <div class="entries-list" id="entries-list"></div>
    </dialog>

    <dialog id="image-dialog" aria-label="Focused image">
        <button class="icon-button dialog-close" id="image-close" type="button" aria-label="Close image">
            <svg class="icon" aria-hidden="true"><use href="#i-x"></use></svg>
        </button>
        <img id="focused-image" alt="">
    </dialog>

    <input type="file" id="open-input" accept=".json,.save,application/json" hidden>
    <input type="file" id="media-upload" accept="image/*,video/*,audio/*,.mp3,.wav,.m4a,.ogg,.aac,.flac" multiple hidden>

    <script src="vendor/quill.js"></script>
    <script src="vendor/purify.min.js"></script>
    <script src="app/app.js"></script>
</body>

</html>
